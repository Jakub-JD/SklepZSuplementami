#Baza danych PostgreSQL w kontenerze
version: '3.8'
services:
  postgres-db:
    image: postgres:16
    container_name: sklep_db_container
    environment:
      POSTGRES_DB: sklep_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    restart: always